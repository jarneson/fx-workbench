# FX Workbench tmux bindings. Source this file from ~/.tmux.conf.
set-hook -g after-select-pane 'run-shell -b "fx-tmux-statusd clear #{pane_id}"'
set-hook -g after-select-window 'run-shell -b "fx-tmux-statusd clear #{pane_id}"'
set-hook -g client-session-changed 'run-shell -b "fx-tmux-statusd clear #{pane_id}"'
set-hook -g client-focus-in 'run-shell -b "fx-tmux-statusd clear #{pane_id}"'

unbind-key -q W
bind-key W display-popup -EE -w 92% -h 85% -e FX_WORKBENCH_CLIENT='#{client_name}' -T 'FX Workbench' fx-workbench
unbind-key -q V
bind-key V display-popup -EE -w 82% -h 70% -d "#{pane_current_path}" -e FX_WORKBENCH_CLIENT='#{client_name}' -T 'Projects' fx-workbench-projects
unbind-key -q P
bind-key P display-popup -EE -w 82% -h 70% -d "#{pane_current_path}" -e FX_WORKBENCH_CLIENT='#{client_name}' -T 'Workstream Planner' fx-workbench-planner
unbind-key -q N
bind-key N display-popup -EE -w 82% -h 70% -d "#{pane_current_path}" -e FX_WORKBENCH_CLIENT='#{client_name}' -T 'New Workstream' fx-workbench-new-workstream
unbind-key -q I
bind-key I run-shell -b "tmux display-popup -c '#{client_tty}' -t '#{pane_id}' -EE -w 80% -h 70% -d #{q:pane_current_path} -e FX_PRINCIPLE_TARGET_PANE='#{pane_id}' -T 'Apply principles' fx-principle pick"
unbind-key -q v
bind-key v run-shell -b "fx-workbench-review-pane '#{pane_id}'"
unbind-key -q T
bind-key T display-popup -EE -w 94% -h 82% -d "#{pane_current_path}" -T 'Delete branch and worktree' fx-workbench-cleanup
